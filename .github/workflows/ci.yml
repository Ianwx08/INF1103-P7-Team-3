name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Docker build and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t lost-and-found .

      - name: Run the unit tests inside the container (networking off)
        run: docker run --rm --network none lost-and-found python -m unittest discover tests -v
